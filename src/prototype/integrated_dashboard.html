<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence-preserving SOC analyst replay</title>
<style>
:root{color-scheme:light dark;--bg:#f5f7fa;--panel:#fff;--text:#17212f;--muted:#536477;--border:#dbe2eb;--accent:#2563eb;--warning:#ad4b1c}
@media(prefers-color-scheme:dark){:root{--bg:#111722;--panel:#1c2634;--text:#eaf0f8;--muted:#acb8c7;--border:#344155;--accent:#8bb5ff;--warning:#ffac79}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}header{padding:20px 26px;background:var(--panel);border-bottom:1px solid var(--border)}h1{margin:0;font-size:21px}h2{font-size:16px}main{max-width:1260px;margin:auto;padding:18px}small,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}.metric{font-size:27px;font-weight:700}.layout{display:grid;grid-template-columns: minmax(0,1fr) minmax(320px,1.1fr);gap:14px}@media(max-width:900px){.layout{grid-template-columns:1fr}}button{cursor:pointer;border:1px solid var(--border);border-radius:7px;padding:8px 12px;background:var(--panel);color:var(--text)}button:hover,button:focus-visible{border-color:var(--accent)}button.selected{background:var(--accent);color:#fff}input{padding:9px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);width:100%}.list{max-height:68vh;overflow:auto}.inc{width:100%;text-align:left;display:block;margin:6px 0}.sev{color:var(--warning);font-weight:650}.events{max-height:350px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px;border-bottom:1px solid var(--border);word-break:break-word}th{color:var(--muted)}.hidden{opacity:.65}.badge{border-radius:4px;background:var(--bg);padding:3px 6px;font-size:12px}.muted-banner{border-left:3px solid var(--warning);padding:10px;background:var(--panel);margin-bottom:14px}
</style></head><body>
<header><h1>SOC alert fatigue reduction — evidence-preserving replay</h1><small>Read-only retrospective demonstration · original alert records retained · not a deployed SOC system</small></header>
<main><div id="error" role="alert"></div><div id="summary" class="grid"></div><div class="muted-banner" id="disclaimer"></div>
<div class="layout"><section class="box"><h2>Reconstructed incidents</h2><label>Filter by decision <select id="filter"><option value="all">All</option><option value="ESCALATE">Escalate</option><option value="INVESTIGATE">Investigate</option><option value="DEMOTE">Demote</option></select></label><p><input id="search" placeholder="Filter by incident # or rule ID"></p><div id="incidents" class="list"></div></section>
<section class="box"><h2>Incident evidence and reduction audit</h2><div id="detail" class="muted">Select an incident on the left.</div></section></div>
</main><script>
'use strict';const $=id=>document.getElementById(id);let state=null,selected=null;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n}
function empty(node){node.replaceChildren()}
function metric(label,v){const b=el('div',undefined,'box');b.append(el('div',v,'metric'),el('small',label));return b}
function render(){if(!state)return;const s=state.stats;empty($('summary'));[['Input alerts',s.alerts],['Reconstructed groups',s.incidents],['Default-visible alerts',s.visible],['Hidden in view',s.hidden],['View reduction',((s.visible_reduction||0)*100).toFixed(1)+'%'],['Evidence constraints',s.covered+'/'+s.requirements]].forEach(([k,v])=>$('summary').append(metric(k,v)));$('disclaimer').textContent=state.metadata.disclaimer+' · Mode: '+state.metadata.correlation+' / '+state.metadata.reducer+' · Experimental protected level: ≥'+state.metadata.critical_level;renderList();renderDetail()}
function renderList(){const list=$('incidents');empty(list);const q=$('search').value.trim().toLowerCase(), f=$('filter').value;const filtered=state.incidents.filter(x=>(f==='all'||f===x.decision)&&(!q||String(x.id).includes(q)||x.alerts.some(a=>a.rule.includes(q))));filtered.sort((a,b)=>b.priority-a.priority);filtered.forEach(x=>{const b=el('button',undefined,'inc'+(x.id===selected?' selected':''));b.append(el('strong','#'+x.id+' — '+x.decision),el('div',x.n_alerts+' alerts · '+x.visible_alerts+' visible · '+x.hidden_alerts+' hidden'),el('small','Max level '+x.max_level+' · score '+x.priority.toFixed(3)));b.onclick=()=>{selected=x.id;renderList();renderDetail()};list.append(b)});if(!filtered.length)list.append(el('div','No matching incidents.','muted'))}
function renderDetail(){const root=$('detail');empty(root);const x=state.incidents.find(x=>x.id===selected);if(!x){root.append(el('div','Select an incident on the left.'));return}root.append(el('h3','Incident #'+x.id+' · '+x.decision),el('p',x.reasons.join(' · ')||'No scorer explanations'),el('p','ATT&CK/tactic sequence: '+(x.tokens.join(' → ')||'not mapped')),el('p','Visible '+x.visible_alerts+'/'+x.n_alerts+' · defined coverage '+x.evidence_audit.constraints_covered+'/'+x.evidence_audit.constraints_total+' · protected '+x.evidence_audit.critical_alerts_retained+'/'+x.evidence_audit.critical_alerts_total));const b=el('button','Show supporting alerts ('+x.hidden_alerts+')');let show=false;b.onclick=()=>{show=!show;b.textContent=show?'Hide supporting alerts':'Show supporting alerts ('+x.hidden_alerts+')';table()};root.append(b);const c=el('div',undefined,'events');root.append(c);function table(){empty(c);const table=el('table'),thead=el('thead'),tr=el('tr');['View','Rule','Level','Techniques','Time'].forEach(v=>tr.append(el('th',v)));thead.append(tr);table.append(thead);const tbody=el('tbody');x.alerts.filter(a=>a.visible||show).forEach(a=>{const tr=el('tr',undefined,a.visible?'':'hidden');[a.visible?'Representative':'Supporting',a.rule,a.level,a.techniques.join(', ')||'—',a.timestamp.slice(11,19)].forEach(v=>tr.append(el('td',v)));tbody.append(tr)});table.append(tbody);c.append(table)}table();const links=el('div',undefined,'muted');links.append(el('strong','Observed correlation evidence: '+x.links.length+' links'));x.links.slice(0,12).forEach(link=>links.append(el('div',(link.reasons||[]).join(' + ')+' · '+(link.seconds||0)+' seconds apart')));if(x.links.length>12)links.append(el('div','Additional links omitted from this display; present in private state.'));root.append(links)}
$('filter').onchange=renderList;$('search').oninput=renderList;
fetch('state.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{state=d;render()}).catch(e=>{$('error').textContent='Cannot load state.json: '+e.message+'. Serve the output directory with python -m http.server.'});
</script></body></html>
